name: Refresh IPTV playlist

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playlist
        uses: actions/checkout@v4
      - name: Rebuild playlist from 12 countries
        run: python .github/scripts/build_playlist.py
      - name: Enrich logos and categories
        run: python .github/scripts/enrich_playlist.py
      - name: Commit updated playlist
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Refresh IPTV channels and metadata"
          git push
