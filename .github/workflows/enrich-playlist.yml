name: Refresh IPTV playlist

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: iptv-playlist-refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playlist
        uses: actions/checkout@v4
      - name: Rebuild playlist from 12 countries
        run: python .github/scripts/build_playlist.py
      - name: Enrich logos and categories
        run: python .github/scripts/enrich_playlist.py
      - name: Test streams and remove persistently unavailable URLs
        run: python .github/scripts/check_streams.py
      - name: Commit updated playlist and health state
        run: |
          if git diff --quiet -- playlist.m3u stream_health.json; then
            echo "No playlist or health-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase the generated outputs on the latest main before publishing.
          # This avoids non-fast-forward failures if another refresh finished first.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add playlist.m3u stream_health.json
            if git diff --cached --quiet; then
              echo "No playlist or health-state changes after syncing with main."
              exit 0
            fi
            git commit -m "Refresh and health-check IPTV channels"
            if git push origin HEAD:main; then
              echo "Playlist and health state published successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying against latest main..."
          done
          echo "Could not publish after 3 attempts."
          exit 1
